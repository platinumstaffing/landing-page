allowBuilds:
  lefthook: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.24
onlyBuiltDependencies:
  - lefthook
  - sharp
  - unrs-resolver
overrides:
  postcss: 8.5.24
  sharp: 0.35.3
  tmp: 0.2.7
  # Dependabot alerts (transitive; keep major lines intact for js-yaml)
  "@hono/node-server": ">=2.0.5"
  uuid: ">=11.1.1"
  # Keep major lines: postcss expects nanoid 3.x; ajv accepts fast-uri 3.x or 4.x
  fast-uri: ">=3.1.5"
  nanoid: ">=3.3.17 <4"
  hono: ">=4.12.34"
  "js-yaml@3": 3.15.1
  "js-yaml@4": 4.3.1

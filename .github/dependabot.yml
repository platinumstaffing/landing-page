version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: release/dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security
    ignore:
      # eslint-config-next / eslint-plugin-react are not ESLint 10 compatible yet
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Next.js 16 still requires the TypeScript 5/6 compiler API (TS 7 breaks builds)
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # Keep @types/node aligned with engines.node (>=24 <25)
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: release/dev
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
